[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pnad-pipeline"
version = "0.1.0"
description = "Pipeline de extração, transformação, carga e análise da PNAD Contínua e IPCA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "pnadium>=0.1.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
